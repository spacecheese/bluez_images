name: Build and Test Images

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Set Matrix
        id: set-matrix
        uses: druzsan/setup-matrix@v2
        with:
          matrix: |
            include:
            - bluez_version: "5.50"
              os: "ubuntu-18.04"
            - bluez_version: "5.64"
              os: "ubuntu-24.04"
            - bluez_version: "5.66"
              os: "ubuntu-24.04"
            - bluez_version: "5.70"
              os: "ubuntu-24.04"

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  build-image:
    needs: setup
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      OS: ${{ matrix.os }}
      BLUEZ_VERSION: ${{ matrix.bluez_version }}
      IMAGE_SPEC: ${{ matrix.os }}-bluez-${{ matrix.bluez_version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget cloud-image-utils \
          qemu-system-x86 qemu-utils

    - name: Build QEMU image
      run: |
        chmod 600 id_ed25519
        ./scripts/build-image.sh "$BLUEZ_VERSION" "$OS"

    - name: Upload image
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.IMAGE_SPEC }}.qcow2
        path: ${{ env.IMAGE_SPEC }}/${{ env.IMAGE_SPEC }}.qcow2

    - name: Upload serial logs
      uses: actions/upload-artifact@v4
      with:
        name: serial.log
        path: ${{ env.IMAGE_SPEC }}/serial*.log

    - name: Attach image to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.IMAGE_SPEC }}/${{ env.IMAGE_SPEC }}.qcow2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attach-key:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Attach private key
      uses: softprops/action-gh-release@v2
      with:
        files: id_ed25519
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  test-image:
    runs-on: ubuntu-latest
    needs: [setup, build-image]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      IMAGE_SPEC: ${{ matrix.os }}-bluez-${{ matrix.bluez_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_SPEC }}.qcow2
          path: .

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils

      - name: Test Image
        run: |
          chmod 600 id_ed25519
          ./scripts/test-image.sh ${{ env.IMAGE_SPEC }}.qcow2